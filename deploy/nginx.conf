# =====================================================================
# Beispiel fuer einen vorgeschalteten Reverse Proxy.
#
# Aufgaben des Proxys:
#   - TLS-Terminierung mit dem Zertifikat der Behoerde
#   - Beschraenkung auf das interne Netz
#   - Begrenzung der Uploadgroesse
# =====================================================================

upstream dokumentenkonverter {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name konverter.landratsamt.intern;
    # Unverschluesselte Aufrufe umleiten.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name konverter.landratsamt.intern;

    ssl_certificate     /etc/ssl/certs/konverter.crt;
    ssl_certificate_key /etc/ssl/private/konverter.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Zugriff auf das Behoerdennetz begrenzen. Der Dienst kennt keine
    # Anmeldung - diese Beschraenkung ist der eigentliche Zugangsschutz.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    # Muss mindestens so gross sein wie MAX_UPLOAD_MB mal Dateianzahl.
    client_max_body_size 2g;
    client_body_timeout 600s;
    client_body_buffer_size 1m;

    # Grosse Dateien nicht zwischenspeichern, sondern durchreichen.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/konverter.access.log;
    error_log  /var/log/nginx/konverter.error.log warn;

    location / {
        proxy_pass http://dokumentenkonverter;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
